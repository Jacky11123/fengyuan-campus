canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:old.button});if(pointers.size===2){const[a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mid=[(a.x+b.x)/2,(a.y+b.y)/2];if(gesture){zoom(gesture.d/Math.max(d,1));pan(mid[0]-gesture.mid[0],mid[1]-gesture.mid[1])}gesture={d,mid}}else if(mode==='walk'){yaw-=dx*.005;pitch=clamp(pitch-dy*.004,-1.2,1.2)}else if(old.button===2||e.shiftKey)pan(dx,dy);else{theta-=dx*.005;phi=clamp(phi+dy*.004,.035,1.5)}dirty=true});

function pan(dx,dy){if(mode==='walk')return;const s=distance*.0012;target[0]+=-dx*Math.cos(theta)*s+dy*Math.sin(theta)*s;target[2]+=dx*Math.sin(theta)*s+dy*Math.cos(theta)*s;target[0]=clamp(target[0],-190,190);target[2]=clamp(target[2],-220,220);dirty=true}
function move(dir,step){if(mode!=='walk')return;const forward=[Math.sin(yaw),-Math.cos(yaw)],right=[Math.cos(yaw),Math.sin(yaw)];const v=dir==='forward'?forward:dir==='back'?forward.map(v=>-v):dir==='right'?right:right.map(v=>-v);eye[0]=clamp(eye[0]+v[0]*step,-155,155);eye[2]=clamp(eye[2]+v[1]*step,-195,198);dirty=true}
const keys=new Set();const keyMap={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};
window.addEventListener('keydown',e=>{if(e.key==='Escape')setView('overview');if(keyMap[e.key]&&mode==='walk'){e.preventDefault();keys.add(keyMap[e.key])}});window.addEventListener('keyup',e=>keys.delete(keyMap[e.key]));window.addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-move]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.move)};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.move)}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);gl.viewport(0,0,canvas.width,canvas.height);dirty=true}window.addEventListener('resize',resize);resize();setView('overview');
let last=0;function render(now){const dt=Math.min((now-last)/1000,.05);last=now;for(const k of keys)move(k,dt*18);if(dirty){dirty=false;let cam,aim;if(mode==='walk'){cam=eye;aim=[eye[0]+Math.sin(yaw)*Math.cos(pitch),eye[1]+Math.sin(pitch),eye[2]-Math.cos(yaw)*Math.cos(pitch)]}else{cam=[target[0]+distance*Math.sin(theta)*Math.cos(phi),target[1]+distance*Math.sin(phi),target[2]+distance*Math.cos(theta)*Math.cos(phi)];aim=target}const vp=multiply(perspective(canvas.width/canvas.height,cam,aim),lookAt(cam,aim));gl.clearColor(.898,.906,.871,1);gl.enable(gl.DEPTH_TEST);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(vpLoc,false,vp);for(const[key,b]of Object.entries(buffers)){if(key==='tree'&&!trees||key==='neighbor'&&!neighbors)continue;gl.bindBuffer(gl.ARRAY_BUFFER,b.buffer);locs.forEach((l,i)=>{gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,36,i*12)});gl.drawArrays(gl.TRIANGLES,0,b.count)}for(const a of annotations){const p=[...a.p,1],q=[0,0,0,0];for(let row=0;row<4;row++)for(let k=0;k<4;k++)q[row]+=vp[k*4+row]*p[k];const x=(q[0]/q[3]+1)*innerWidth/2,y=(1-q[1]/q[3])*innerHeight/2;a.el.hidden=!showLabels||mode==='walk'||q[3]<=0||x<20||x>innerWidth-20||y<60||y>innerHeight-90;a.el.style.left=x+'px';a.el.style.top=(y-15)+'px'}}requestAnimationFrame(render)}requestAnimationFrame(render);
// Read-only diagnostics for geometry and camera verification.
window.campusModel={eastGate,eastParkingAreas,curbParking,dormitoryVolumes,dormGroundAreas,planPositions,annotations,northConnection,assemblyStage,namedBuildings,extraSports,sportsAreas,driveway,drivewayWidth,roadClearance,footprints,treePositions,counts:Object.fromEntries(Object.entries(buffers).map(([k,v])=>[k,v.count])),setView,getState:()=>({mode,distance,target:[...target],eye:[...eye],trees,neighbors,showLabels})};
